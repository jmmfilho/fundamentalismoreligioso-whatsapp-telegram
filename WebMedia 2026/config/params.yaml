filters:
  # Matching is case-insensitive SUBSTRING matching on the preprocessed text
  # (accents removed, stopwords removed), exactly as in the paper run.
  # Set `match: word` to require whole-word matches (changes the counts).
  match: substring
  # Inclusion filter: intersection of the lists provided by three
  # professionals with degrees in Theology (Section 3.1 of the paper).
  religious_keywords:
    - deus
    - jesus
    - misericordia
    - davi
    - salomao
    - reino
    - templo
    - conservador
    - pentecostal
    - rcc
    - renovacao
    - carismatic        # stem: matches carismatico/carismatica
    - paulo ricardo
    - bernardo kuster
    - herege
    - ateu
    - jerico
    - heresia
  # Exclusion filter: election-campaign terms, defined empirically.
  political_keywords:
    - lula
    - bolsonaro
    - pt
    - pl
    - stf
    - patria
    - "55"
    - "22"
    - "13"
    - senadores
    - lulaladrao
    - urnas
    - alexandre
    - moraes
    - comunismo
    - eleicao
    - eleicoes
    - esquerda
    - direita
    - presidente
    - tse
    - fraude
    - voto
    - turno
    - ministro

preprocessing:
  # Added on top of NLTK's Portuguese stopword list.
  custom_stopwords: [t, be, nao, youtu, vai, av, ja, to, the, this, i, and, you, y,
    www, sao, pois, contra, user, ai, so, gente, voce, of, ola, gift, card,
    kwaivideo, r, bom, q, vc, vcs, pra, ta, phone, ok, la, sera, ha, aqui, ate,
    dia, mc, im, tmj, pix, g, diz, ti, etc, tudo, todo, toda, youtube, g1, m,
    instagram, fb, in, link, was, blocked, kk]

ner:
  spacy_model: pt_core_news_sm
  transformer_model: Davlan/xlm-roberta-base-ner-hrl
  top_n: 10
  # The paper run truncated texts to 1,000 characters for FW.Br but not for
  # FT.Br (see REPRODUCIBILITY_NOTES). null = no truncation.
  max_chars: {whatsapp: 1000, telegram: null}

polarity:
  column: score_sentiment       # LeIA score computed at ingestion (BATMAN)
  neutral_band: 0.05            # |score| <= 0.05 -> neutral
  group_min_messages: [10, 30]   # robustness check (median score per group)

topics:
  k_min: 2
  k_max: 30          # exclusive upper bound, as in range(2, 30, 2)
  k_step: 2
  selection_metric: c_v
  report_metrics: [c_v, c_npmi]
  top_n_words: 10
  lda:
    passes: 5
    workers: 4
    coherence_topn: 20          # gensim default used in the paper run
  ptm:
    iterations: 100
  bertopic:
    embedding_model: paraphrase-multilingual-MiniLM-L12-v2
    umap: {n_neighbors: 15, n_components: 5, metric: cosine}
    hdbscan: {min_cluster_size: 30, metric: euclidean}

liwc:
  alpha: 0.05
  correction: holm
