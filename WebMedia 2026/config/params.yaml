# Parameters used to produce the results reported in the WebMedia 2026 paper.
# Every value here was transcribed from the original analysis notebooks
# (now kept in notebooks/legacy/). Change them only for new experiments,
# and record any change in docs/REPRODUCIBILITY_NOTES.md.

seed: 42

paths:
  raw:
    whatsapp: data/raw/fakeWhatsApp.BR_2022.csv
    telegram: data/raw/fakeTelegram.BR_2022.csv
  liwc_dictionary: data/external/LIWC2007_Portugues_win.dic
  processed: data/processed
  results: results/generated

